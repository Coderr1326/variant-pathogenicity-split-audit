checkpoints:
  dnabert2:
    exact_paper_checkpoint: UNKNOWN
    selected: "zhihan1996/DNABERT-2-117M"
    reason: "Only public DNABERT-2 release specified by reproduction brief"
    parameter_count: "117M"
    pooling_architecture: "mean pooling over the attention-masked hidden states, via a standalone encoder+classifier head (not src/training/transformer_utils.py's SequenceWrapper)"
    pooling_provenance: >
      Epochs 1-9 ran on Colab; epoch 10 was finished locally via
      scripts/finish_dnabert2_locally.py on 2026-08-16, which resumed from the
      downloaded epoch_09.pt checkpoint. That checkpoint's state_dict keys
      (encoder.*/classifier.*) confirm the original Colab run already used this
      mean-pooling head, not CLS-token pooling. src/training/transformer_utils.py's
      SequenceWrapper (CLS-token pooling, z[:,0]) was introduced afterward
      (2026-09-06) for the Nucleotide Transformer run and was never used for
      DNABERT-2 — the two models do not share a pooling architecture. Re-running
      DNABERT-2 through the current notebook/load_transformer() would silently
      switch it to CLS pooling and would not reproduce this checkpoint lineage.
  nucleotide_transformer:
    exact_paper_checkpoint: UNKNOWN
    selection_order:
